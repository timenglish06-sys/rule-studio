name: Decode documentation assets

on:
  push:
    paths:
      - "docs/_b64/**"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  decode:
    runs-on: ubuntu-latest
    if: github.repository == 'timenglish06-sys/rule-studio'
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Decode base64 assets, verify, and commit binaries
        run: |
          set -euo pipefail

          if [ ! -d docs/_b64 ]; then
            echo "No docs/_b64 directory; nothing to decode."
            exit 0
          fi

          shopt -s nullglob

          decode_stream() {
            # GNU coreutils base64; ignore wrapping
            base64 -d
          }

          # Unsplit *.b64 files (not .b64.part*)
          for f in docs/_b64/*.b64 docs/_b64/*/*.b64; do
            [ -f "$f" ] || continue
            rel="${f#docs/_b64/}"
            dest="docs/${rel%.b64}"
            mkdir -p "$(dirname "$dest")"
            decode_stream < "$f" > "$dest"
            echo "Decoded $f -> $dest ($(wc -c < "$dest") bytes)"
          done

          # Split files: concatenate zero-padded parts, then decode
          for first in docs/_b64/*.b64.part000 docs/_b64/*/*.b64.part000; do
            [ -f "$first" ] || continue
            prefix="${first%.part000}"
            rel="${prefix#docs/_b64/}"
            dest="docs/${rel%.b64}"
            mkdir -p "$(dirname "$dest")"
            cat "${prefix}".part[0-9][0-9][0-9] | decode_stream > "$dest"
            echo "Decoded ${prefix}.part* -> $dest ($(wc -c < "$dest") bytes)"
          done

          if [ -f docs/_b64/MANIFEST.tsv ]; then
            failed=0
            while IFS=$'\t' read -r dest size blob sha || [ -n "${dest:-}" ]; do
              case "$dest" in
                ''|\#*) continue ;;
              esac
              if [ ! -f "$dest" ]; then
                echo "Missing decoded file: $dest" >&2
                failed=1
                continue
              fi
              actual_size=$(wc -c < "$dest" | tr -d ' ')
              actual_sha=$(sha256sum "$dest" | awk '{print $1}')
              if [ "$actual_size" != "$size" ] || [ "$actual_sha" != "$sha" ]; then
                echo "Checksum/size mismatch for $dest (size $actual_size vs $size, sha $actual_sha vs $sha)" >&2
                failed=1
              else
                echo "Verified $dest ($actual_size bytes, sha256 $actual_sha)"
              fi
            done < docs/_b64/MANIFEST.tsv
            if [ "$failed" -ne 0 ]; then
              echo "Manifest verification failed." >&2
              exit 1
            fi
          fi

          rm -rf docs/_b64
          rm -f .github/workflows/decode-assets.yml
          if [ -d .github/workflows ] && [ -z "$(ls -A .github/workflows 2>/dev/null || true)" ]; then
            rmdir .github/workflows || true
          fi
          if [ -d .github ] && [ -z "$(ls -A .github 2>/dev/null || true)" ]; then
            rmdir .github || true
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "Add documentation screenshots and Word spec"
          git push
